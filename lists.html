<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main">
      <div class="sidepanel" id="sidepanel">
        <div class="webName">
          <!-- <img src="./images/logo.png" alt="logo" /> -->
          <span>Todos</span>
        </div>
        <div class="navBar1">
          <div class="scene">
            <a href="./index.html" class="cube">
              <span class="side top">Dashboard</span>
              <span class="side front">Dashboard</span>
            </a>
          </div>
          <div class="scene">
            <a href="./lists.html" class="cube">
              <span class="side top">Lists</span>
              <span class="side front">Lists</span>
            </a>
          </div>
          <div class="scene">
            <div class="cube">
              <span class="side top">Inbox</span>
              <span class="side front">Inbox</span>
            </div>
          </div>
        </div>

        <div class="navBar2">
          <div class="scene">
            <div class="cube">
              <span class="side top">Messages</span>
              <span class="side front">Messages</span>
            </div>
          </div>
          <div class="scene">
            <div class="cube">
              <span class="side top">Work</span>
              <span class="side front">Work</span>
            </div>
          </div>
          <div class="scene">
            <div class="cube">
              <span class="side top">Study</span>
              <span class="side front">Study</span>
            </div>
          </div>
          <div class="scene">
            <div class="cube">
              <span class="side top">Health</span>
              <span class="side front">Health</span>
            </div>
          </div>
          <div class="scene">
            <div class="cube">
              <span class="side top">Holiday Trip</span>
              <span class="side front">Holiday Trip</span>
            </div>
          </div>
        </div>
      </div>
      <div class="mainsection">
        <button class="btn" id="hamburger">
          <span class="icon">
            <svg viewBox="0 0 175 80" width="40" height="40">
              <rect width="80" height="15" fill="#f0f0f0" rx="10"></rect>
              <rect y="30" width="80" height="15" fill="#f0f0f0" rx="10"></rect>
              <rect y="60" width="80" height="15" fill="#f0f0f0" rx="10"></rect>
            </svg>
          </span>
          <span class="text">Todos</span>
        </button>
        <div class="overlay" id="overlay"></div>
        <div class="addtask-minimal">
          <input
            id="input"
            type="text"
            class="quick-add"
            placeholder="+ Add a task..."
          />
          <div class="options-wrapper">
            <input type="time" id="time" />
            <input type="date" id="date" />

            <select id="Category">
              <option value="work">Work</option>
              <option value="study">Study</option>
              <option value="health">Health</option>
            </select>
            <button class="plusButton" onclick="addTodo()">
              <svg class="plusIcon" viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div>
        <h1>My Lists</h1>
      </div>
      <ul class="tskLst" id="taskListVeiw"></ul>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
