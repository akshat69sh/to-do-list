<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Taskify</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="header">
      <!-- Logo -->
      <div class="logoName">
        <img
          src="./images/taskify-logo-transparent.png"
          alt="Taskify logo"
          class="logo"
        />

        <span>Taskify</span>
      </div>

      <!-- Centre navigation -->
      <nav class="pill-nav">
        <button class="pill-nav-button">Lists</button>

        <button class="pill-nav-button">Calendar</button>

        <button class="pill-nav-button active">Messages</button>
      </nav>

      <!-- Right toolbar -->
      <div class="user-tool-bar">
        <!-- Settings -->
        <button type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 15.5a3.5 3.5 0 1 0 0-7
              3.5 3.5 0 0 0 0 7Z"
            />

            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06
              -2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34
              1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08
              A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34
              l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0
              4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08
              A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88
              l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0
              9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.08
              A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0
              1.88-.34l.06-.06 2.83 2.83-.06.06A1.7
              1.7 0 0 0 19.37 9 1.7 1.7 0 0 0
              20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"
            />
          </svg>
        </button>

        <!-- Notifications -->
        <button type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24">
            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18
              c0-2-3-2-3-9Z"
            />

            <path d="M14.5 21h-5" />
          </svg>

          <span class="notification-dot"></span>
        </button>

        <!-- Profile -->
        <button type="button" aria-label="Profile">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />

            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
        </button>
      </div>
    </header>
  </body>
</html>
